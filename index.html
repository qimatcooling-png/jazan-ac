<!DOCTYPE html>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #0d2b45; display: flex; justify-content: center; }
    .page-container { width: 100%; max-width: 450px; background-color: #f8fbff; min-height: 100vh; position: relative; }
    .header { background: linear-gradient(180deg, #007bff 0%, #0056b3 100%); color: white; text-align: center; padding: 30px 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
    .badge { background-color: #ffc107; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; margin-bottom: 15px; display: inline-block; }
    .icon-circle { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 15px; }
    .title { font-size: 1.6rem; font-weight: bold; margin-bottom: 5px; }
    .location { font-size: 0.9rem; opacity: 0.9; }
    .offer-banner { background-color: #ff9800; color: #fff; text-align: center; padding: 15px; font-weight: bold; font-size: 1.1rem; margin: 15px 0; }
    .services-header { text-align: center; color: #0056b3; font-weight: bold; margin: 15px 0; display: flex; justify-content: center; align-items: center; gap: 5px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
    .card { background-color: #eef6ff; border: 1px solid #d1e7ff; border-radius: 12px; padding: 20px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .card-icon { font-size: 2rem; }
    .card-text { font-size: 0.9rem; font-weight: bold; color: #333; }
    
    /* الأزرار العائمة */
    .float-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 100; }
    .float-btn { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-decoration: none; }
    .whatsapp { background-color: #25d366; }
    .call { background-color: #007bff; }
  </style>
</head>

      <div class="card"><div class="card-icon">🔧</div><div class="card-text">صيانة وإصلاح المكيفات</div></div>
      <div class="card"><div class="card-icon">🌡️</div><div class="card-text">فحص وشحن الغاز</div></div>
      <div class="card"><div class="card-icon">🔌</div><div class="card-text">تركيب وتوصيل المكيفات</div></div>
      <div class="card"><div class="card-icon">🏡</div><div class="card-text">خدمة منزلية للأفراد والشركات</div></div>
      <div class="card"><div class="card-icon">🔄</div><div class="card-text">استبدال القطع التالفة</div></div>
    </div>

    <div class="float-container">
      <a href="https://wa.me/966562643118" class="float-btn whatsapp" target="_blank"><i class="fab fa-whatsapp"></i></a>

</html>

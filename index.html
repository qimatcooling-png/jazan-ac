<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جيزان الخدمة للمكيفات</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; background-color: #f8fbff; display: flex; justify-content: center; }
    .page-container { width: 100%; max-width: 450px; min-height: 100vh; position: relative; }
    .header { background: linear-gradient(180deg, #007bff 0%, #0056b3 100%); color: white; text-align: center; padding: 30px 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
    .badge { background-color: #ffc107; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; margin-bottom: 15px; display: inline-block; }
    .icon-circle { width: 80px; height: 80px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 15px; }
    .title { font-size: 1.6rem; font-weight: bold; margin-bottom: 5px; }
    .location { font-size: 0.9rem; opacity: 0.9; }
    .offer-banner { background-color: #ff9800; color: #fff; text-align: center; padding: 15px; font-weight: bold; font-size: 1.1rem; margin: 15px 0; }
    .services-header { text-align: center; color: #0056b3; font-weight: bold; margin: 15px 0; display: flex; justify-content: center; align-items: center; gap: 5px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
    .card { background-color: #ffffff; border: 1px solid #e1e1e1; border-radius: 12px; padding: 20px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card-icon { font-size: 2rem; }
    .card-text { font-size: 0.9rem; font-weight: bold; color: #333; }
    
    /* تصميم قسم تواصل معنا الثابت */
    .contact-section { background-color: #0d2b45; margin: 20px; padding: 20px; border-radius: 20px; text-align: center; color: white; }
    .contact-title { font-size: 1.1rem; margin-bottom: 10px; }
    .phone-number { font-size: 2rem; font-weight: bold; color: #ffc107; margin: 10px 0; }
    .contact-buttons { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border-radius: 12px; text-decoration: none; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; }
    .whatsapp-btn { background-color: #25d366; }
    .call-btn { background-color: #007bff; }

    /* الأزرار العائمة (الدائرية) */
    .float-container { position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 15px; z-index: 999; }
    .float-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-decoration: none; }
    .whatsapp-float { background-color: #25d366; }
    .call-float { background-color: #007bff; }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="header">
      <div class="badge">🏆 خدمة موثوقة - متاح 24/7</div>
      <div class="icon-circle">❄️</div>
      <div class="title">جيزان الخدمة للمكيفات</div>
      <div class="location">📍 جيزان – المملكة العربية السعودية</div>
    </div>

    <div class="offer-banner">🔥 عروض الصيف | خصم 20% على الصيانة الشاملة</div>

    <div class="services-header">🔧 خدماتنا</div>

    <div class="grid">
      <div class="card"><div class="card-icon">🚿</div><div class="card-text">تنظيف المكيفات</div></div>
      <div class="card"><div class="card-icon">🔧</div><div class="card-text">صيانة وإصلاح</div></div>
      <div class="card"><div class="card-icon">🌡️</div><div class="card-text">شحن غاز الفريون</div></div>
      <div class="card"><div class="card-icon">🔌</div><div class="card-text">تركيب المكيفات</div></div>
    </div>

    <!-- قسم التواصل الثابت -->
    <div class="contact-section">
      <div class="contact-title">تواصل معنا الآن</div>
      <div class="phone-number">0562643118</div>
      <div class="contact-buttons">
        <a href="https://wa.me/966562643118" class="btn whatsapp-btn"><i class="fab fa-whatsapp"></i> واتساب</a>
        <a href="tel:+966562643118" class="btn call-btn"><i class="fas fa-phone"></i> اتصل بنا</a>
      </div>
    </div>

    <!-- الأزرار العائمة (الدائرية) -->
    <div class="float-container">
      <a href="https://wa.me/966562643118" class="float-btn whatsapp-float"><i class="fab fa-whatsapp"></i></a>
      <a href="tel:+966562643118" class="float-btn call-float"><i class="fas fa-phone"></i></a>
    </div>

  </div>
</body>
</html>
